[package]
name = "pi-env"
# Upstream's env daemon is authored for edition 2024 (let-chains throughout); the workspace defaults
# to 2021, so this crate overrides it, as upstream's `daemon/Cargo.toml` does.
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pi-env"
path = "src/daemon/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }


[dev-dependencies]
pi-ai = { path = "../pi-ai" }

[dependencies]
getrandom = "0.2"
async-trait = "0.1"
encoding_rs = "0.8"
notify = "8.2"
parking_lot = { workspace = true }
pi-chord = { path = "../pi-chord" }
pi-durable = { path = "../pi-durable" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
