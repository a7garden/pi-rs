[package]
name = "pi-coding-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Async trait impls in core/model_runtime (upstream class methods).
async-trait = "0.1"
# URL hostname matching in core/provider_attribution (upstream `new URL`).
url = "2"
# Session ids (upstream crypto.randomUUID → generateId).
getrandom = "0.2"
# Insertion-ordered entry/label indexes (upstream Map iteration order).
indexmap = { version = "2", features = ["serde"] }
# Settings storage locks (lock() without poisoning boilerplate).
parking_lot = "0.12"
# Gitignore-style skill-path filtering (upstream the npm `ignore` package).
ignore = "0.4"
# npm semver comparisons in core/package-manager (upstream npm `semver`).
semver = "1"
# Glob expansion and pattern matching in core/package-manager (upstream
# node:fs globSync + npm minimatch).
glob = "0.3"
# Temp-dir name hashing in core/package-manager (upstream node:crypto).
sha2 = "0.10"
# Ordered concurrent task execution in core/package-manager (upstream
# Promise.all worker pools).
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Process-group termination in utils/shell (upstream process.kill).
libc = "0.2"
# Line diffs and unified patches in core/tools/edit-diff (upstream npm `diff`).
similar = "2"
# NFD normalization in core/tools/path-utils (upstream String.normalize).
unicode-normalization = "0.1"
# DEFLATE streams for utils/zip (upstream fflate).
flate2 = "1"
# HTTP fetch in utils/management-http (upstream global fetch).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Wire types cross process boundaries (session JSONL files).
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# Session listing/discovery (async list/listAll, spawn_blocking file scans).
tokio = { workspace = true }
pi-ai = { path = "../pi-ai" }
pi-agent = { path = "../pi-agent" }

[dev-dependencies]
# `tokio::time::advance` / `start_paused` in ported async tests (`full` excludes `test-util`).
tokio = { version = "1", features = ["test-util"] }
