[package]
name = "pi-ai"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Wire types cross process/network boundaries (models store, generated catalog, provider payloads).
serde = { workspace = true }
# TelemetryContext passed through provider request options.
pi-telemetry = { path = "../pi-telemetry" }
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = { workspace = true }
# Adapter tasks (lazy_stream spawn), abort races, sleep, default fetch client runtime.
tokio = { workspace = true }
# Async provider methods (trait objects) — pi-chord/pi-mcp precedent.
async-trait = "0.1"
# Stream trait for AssistantMessageEventStream and SSE response bodies.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Default HTTP adapter behind the crate's FetchFunction seam (rustls, pi-mcp precedent).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Randomness for uuidv7 (upstream crypto.getRandomValues).
getrandom = "0.2"
# Context-overflow error patterns (utils/overflow.ts) and model-data validation.
regex = "1"
# Wave B (OAuth PKCE, callback URLs, Bedrock SigV4, misc encoding).
sha2 = "0.10"
base64 = "0.22"
url = "2"
hex = "0.4"
parking_lot = { workspace = true }
# google-vertex service-account flow: RS256-signed JWT exchange (upstream google-auth-library).
rsa = "0.9"

[dev-dependencies]
# Paused-clock tests (tokio::time::pause/advance) for retry backoff timing.
tokio = { workspace = true, features = ["test-util"] }
