[workspace]
resolver = "2"
members = ["crates/*"]

# Workspace version mirrors the upstream pi release that has been ported.
[workspace.package]
version = "1.0.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/earendil-works/pi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
deno_core = "0.412"
ciborium = "0.2"

[profile.release]
lto = "thin"
